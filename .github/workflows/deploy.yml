name: Build & Deploy to EC2

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

  deploy:
    name: Deploy to EC2 (Production Only)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: SSH into EC2 and deploy
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /home/ubuntu/app/PastaLab
            
            # Pull the latest code
            git pull origin prod
            
            # Install dependencies
            npm install
            
            # Create the .env file with secrets
            echo "PASSWORD_HASH=${{ secrets.PASSWORD_HASH }}" > .env
            echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env
            echo "NEXT_PUBLIC_ORGANIZATION_ID=${{ secrets.NEXT_PUBLIC_ORGANIZATION_ID }}" >> .env
            echo "NEXT_PUBLIC_TERMINAL_GROUP_ID=${{ secrets.NEXT_PUBLIC_TERMINAL_GROUP_ID }}" >> .env

            # Build the app
            npm run build
            
            # Restart the server with PM2
            pm2 restart PastaLab || pm2 start npm --name PastaLab -- start
            
            # Reload Nginx for updated proxy settings
            sudo nginx -t && sudo systemctl reload nginx
            
            # Save the PM2 process list for auto-restart on reboot
            pm2 save
          EOF
